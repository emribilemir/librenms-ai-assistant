# This is a server-context include: include it inside the active LibreNMS
# server {} block, never directly as a top-level http/conf.d file.
# The trailing slash on proxy_pass removes /ai-api/ so the service receives /v1/...
location ^~ /ai-api/ {
    proxy_pass http://192.168.64.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_set_header X-Accel-Buffering no;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
    add_header X-Accel-Buffering no always;
}
